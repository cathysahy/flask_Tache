<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titre %}Mes tâches{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="entete">
    <h1>Gestion de tâches</h1>
    <nav>
        <a href="{{ url_for('index') }}">Accueil</a>
        <a href="{{ url_for('ajouter') }}">Ajouter une tâche</a>
        <a href="{{ url_for('api_taches') }}">API JSON</a>
    </nav>
</header>

<main class="conteneur">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for categorie, message in messages %}
                <p class="flash {{ categorie }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block contenu %}{% endblock %}
</main>
<footer><p>TP Flask — Licence 3 — UPA</p></footer>
</body>
</html>
